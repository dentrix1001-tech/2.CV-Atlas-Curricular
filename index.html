<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador 2.CV — Versión GitHub Pages</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="container" style="max-width: 750px; margin-top: 40px;">
    <div class="sec-block">
      <h1 class="sec-title"><span>1</span> Generador Web 2.CV (Cliente GitHub)</h1>
      <p style="margin-bottom: 16px; font-size: 0.93rem;">
        Sube tu archivo de texto o currículum. El sistema adaptará los datos instantáneamente al formato HTML modular del Atlas Curricular para su descarga directa.
      </p>

      <div class="card-box" style="text-align: center; padding: 30px;">
        <input type="file" id="cv-file-input" accept=".txt" style="margin-bottom: 15px; font-size: 1rem;">
        <p style="font-size: 0.8rem; color: #64748b;">Sube un archivo de texto plano (.txt) con la información de tu currículum.</p>
      </div>

      <button id="btn-generar" class="ctrl-btn" style="width: 100%; justify-content: center; padding: 12px; font-size: 1rem; background: var(--brand-primary); margin-top: 15px;">
        <i class="fa-solid fa-wand-magic-sparkles"></i> Generar y Descargar mi 2.CV en HTML
      </button>
    </div>
  </div>

  <script src="assets/script.js"></script>
</body>
</html>
